# Cloud Build for the console. Used by the frontend trigger; run by hand with
#   gcloud builds submit --config web/cloudbuild.yaml
# from the repo root.
#
# This replaces the buildpack trigger, which spent its time in two places: about
# a minute pulling the buildpack builder, then four minutes on a
# `docker pull --all-tags` that downloaded every frontend image ever pushed only
# to push them back. Here buildx pushes the one new image itself and reuses the
# dependency install from the registry cache.

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    entrypoint: bash
    args:
      - -euc
      - |
        # the docker-container driver is what can export a cache; it must join
        # the cloudbuild network to reach the metadata server for credentials
        docker buildx create --name ci --driver docker-container \
          --driver-opt network=cloudbuild --use
        tags="--tag=${_IMAGE}:${BUILD_ID}"
        if [ -n "${COMMIT_SHA}" ]; then tags="$$tags --tag=${_IMAGE}:${COMMIT_SHA}"; fi
        docker buildx build $$tags \
          --cache-from=type=registry,ref=${_IMAGE}:buildcache \
          --cache-to=type=registry,ref=${_IMAGE}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true \
          --push web

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: bash
    args:
      - -euc
      - |
        # Only the image changes. The service's env (Supabase keys, GATEWAY_URL,
        # demo login) is set on the service and kept as it is.
        if gcloud run services describe ${_SERVICE} --region=${_REGION} >/dev/null 2>&1; then
          gcloud run services update ${_SERVICE} --region=${_REGION} \
            --image=${_IMAGE}:${BUILD_ID} --quiet
        else
          gcloud run deploy ${_SERVICE} --region=${_REGION} \
            --image=${_IMAGE}:${BUILD_ID} --platform=managed --port=8080 --quiet
        fi

substitutions:
  _SERVICE: frontend
  _REGION: europe-west1
  _AR_REPO: cloud-run-source-deploy
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}

options:
  # `next build` compiles and type-checks on every core it gets
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  # COMMIT_SHA is empty for `gcloud builds submit`; do not fail on it
  substitutionOption: ALLOW_LOOSE

timeout: 1200s
