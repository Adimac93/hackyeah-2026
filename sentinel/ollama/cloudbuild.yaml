# Docker Hub's ollama image plus ~5 GB of weights: the default build machine is
# too small and too slow, hence the larger machine and disk.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
