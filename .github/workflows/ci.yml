name: ci

on:
  pull_request:
  push:
    branches: [main]

# a newer push supersedes an in-flight run — keeps the queue short on a hackathon day
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `just` from the Ubuntu archive — no third-party action in the supply chain
      - run: sudo apt-get update && sudo apt-get install -y just

      # `just check` now covers both the Rust workspace and the web app, so the
      # runner needs both toolchains.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: just setup
      - run: just check
