# Attack signature feed (task.md §4.4).
#
# A separate document from the control catalog so a security team can manage
# signatures without touching controls. It is uploaded with the catalog
# (`signatures_toml` in POST /admin/policy), versioned with it, and mirrored
# into `attack_signatures` for the dashboard. This copy is the built-in sample.

source = "local-demo-feed"
version = 1

[[signature]]
external_id = "AIS-0001"
title = "Pickle deserialization in model checkpoint load"
kind = "deterministic"
severity = "critical"
pattern = '(?i)torch\.load\s*\([^)]*weights_only\s*=\s*False'

[[signature]]
external_id = "AIS-0002"
title = "Model pulled from an unpinned third-party repository"
kind = "deterministic"
severity = "high"
pattern = '''(?i)from_pretrained\s*\(\s*["'][^"']+["']\s*\)'''

[[signature]]
external_id = "AIS-0003"
title = "Shell metacharacters in a tool argument"
kind = "deterministic"
severity = "high"
pattern = '[;&|`]\s*(curl|wget|nc|bash|sh)\b'

[[signature]]
external_id = "AIS-0004"
title = "Base64 blob followed by a decode-and-execute pattern"
kind = "deterministic"
severity = "critical"
pattern = '(?i)(base64\s*(-d|--decode)|b64decode)[^\n]{0,40}\|\s*(sh|bash|python)'

# --- OWASP LLM03 supply chain / LLM04 data and model poisoning ---------------

[[signature]]
external_id = "AIS-0005"
title = "Hugging Face model loaded with trust_remote_code=True"
kind = "deterministic"
severity = "high"
pattern = '(?i)\btrust_remote_code\s*=\s*True\b'

[[signature]]
external_id = "AIS-0006"
title = "NumPy array loaded with allow_pickle=True"
kind = "deterministic"
severity = "critical"
pattern = '(?i)\bnp\.load\s*\([^)]*allow_pickle\s*=\s*True'

[[signature]]
external_id = "AIS-0007"
title = "Pickle-based loader (joblib, dill, cloudpickle) on an artifact"
kind = "deterministic"
severity = "high"
pattern = '(?i)\b(?:joblib|dill|cloudpickle)\.loads?\s*\('

[[signature]]
external_id = "AIS-0008"
title = "Remote script piped straight into a shell or interpreter"
kind = "deterministic"
severity = "critical"
pattern = '(?i)\b(?:curl|wget)\b[^|\n]*\|\s*(?:sudo\s+)?(?:sh|bash|zsh|python3?)\b'

[[signature]]
external_id = "AIS-0009"
title = "pip install with an extra index URL (dependency confusion)"
kind = "deterministic"
severity = "high"
pattern = '(?i)\bpip3?\s+install\b[^\n]*--extra-index-url\b'

[[signature]]
external_id = "AIS-0010"
title = "Keras model loaded with safe_mode=False (Lambda layer code execution)"
kind = "deterministic"
severity = "critical"
pattern = '(?i)\bload_model\s*\([^)]*safe_mode\s*=\s*False'
