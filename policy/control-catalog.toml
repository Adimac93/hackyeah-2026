# AI Control Layer — control catalog.
#
# The catalog is the single configuration source (task.md §4.1). It lives in
# the database: this file is the documented sample, compiled into the gateway
# and seeded on first start. To change the running policy, upload an edited
# copy (console, or POST /admin/policy); every instance activates it within
# 5 s, and in-flight requests finish under the policy they started with. An
# invalid upload is rejected with the error and the last good version keeps
# serving — a config typo must never take the control layer offline.
#
# Budgets are not set here: they are rows in the `budgets` table, edited
# through PUT /admin/budgets. Model and tool grants per identity live in
# `principals` and are deny-by-default.
#
# Patterns use TOML literal strings ('...'), so regex backslashes need no
# escaping. Write the regex exactly as you would test it.
#
# Every control takes `enabled = false` to switch it off without deleting it.
# Unknown keys are rejected, so a misspelled setting fails the upload loudly
# instead of being ignored.

schema_version = 1
# The active profile supplies defaults only; a control's explicit `action` or
# `fail_mode` always wins. Change this to `permissive` or `strict` during a
# demo to alter unqualified controls without editing every rule.
profile = "balanced"

[profiles.permissive]
on_detect = "flag"
fail_mode = "open"

[profiles.balanced]
on_detect = "block"
fail_mode = "closed"

[profiles.strict]
on_detect = "block"
fail_mode = "closed"

[defaults]
# Applied when a control does not set its own. allow | redact | block
on_detect = "block"
# What to do when a control itself errors or times out. closed = deny.
fail_mode = "closed"

[models]
# Deny wins over allow. Empty allowed list means "any model not denied". Each
# identity's `allowed_models` then narrows this further.
allowed = ["llama3.1:8b", "qwen2.5:7b", "mistral:7b"]
denied = []

# ---------------------------------------------------------------- pricing
# USD per million tokens, used for `limit_usd` budgets and cost reporting. The
# local models carry an internal chargeback rate; a commercial model would use
# its list price. An unpriced model costs nothing.

[pricing."llama3.1:8b"]
input_per_mtok = 0.20
output_per_mtok = 0.20

[pricing."qwen2.5:7b"]
input_per_mtok = 0.20
output_per_mtok = 0.20

[pricing."mistral:7b"]
input_per_mtok = 0.20
output_per_mtok = 0.20

# ---------------------------------------------------------------- history
# §4.4. The risk score is the sum of recent blocked/flagged detections for an
# identity (critical 1.0, high 0.65, medium 0.35, low 0.15). Past
# `escalate_at`, every request runs the semantic tier; past `block_at`, the
# identity is refused until the window passes.

[risk]
window_secs = 3_600
escalate_at = 1.0
block_at = 5.0

# ---------------------------------------------------------------- runaway
# §4.3 runaway agent protection, per identity, counted over the window. An
# agent reports its nesting depth in `_meta.depth` of a tool call.

[runaway]
window_secs = 60
max_tool_calls = 30
max_identical_calls = 5
max_depth = 4

# ---------------------------------------------------------------- resources
# Tables of the `resources` schema each identity may query through the
# gateway's `resources__describe` / `resources__query` tools. Deny-by-default.
# The model only ever sees structure and a row count; the rows go to the user.

[resources]
max_rows = 200
statement_timeout_ms = 2_000

[resources.grants]
demo-agent = ["customers", "invoices"]

# ---------------------------------------------------------------- tier 1
# Deterministic controls. Microseconds, no model, no network. Every request
# pays this cost, so keep the patterns cheap.

[[controls.deterministic]]
id = "secret.aws-access-key"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "critical"
action = "block"
pattern = '\bAKIA[0-9A-Z]{16}\b'

[[controls.deterministic]]
id = "secret.private-key"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "critical"
action = "block"
pattern = '-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'

[[controls.deterministic]]
id = "secret.bearer-token"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "high"
action = "redact"
pattern = '(?i)\b(bearer|api[_-]?key|authorization)\s*[:=]\s*[A-Za-z0-9._\-]{20,}'

# OWASP LLM02 secrets. They run before the pii.* redactors on purpose:
# controls apply in catalog order, and a PII pattern that redacts a token's
# digit run first would leave the rest of the secret in the text.

[[controls.deterministic]]
id = "secret.github-token"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "critical"
action = "redact"
pattern = '\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,})\b'

[[controls.deterministic]]
id = "secret.slack-token"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "high"
action = "redact"
pattern = '\bxox[abposr]-[A-Za-z0-9-]{10,}\b'

[[controls.deterministic]]
id = "secret.google-api-key"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "high"
action = "redact"
pattern = '\bAIza[0-9A-Za-z_\-]{35}\b'

[[controls.deterministic]]
id = "secret.llm-api-key"
# OpenAI- and Anthropic-style keys.
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "critical"
action = "redact"
pattern = '\bsk-(?:ant-|proj-)?[A-Za-z0-9_\-]{20,}'

[[controls.deterministic]]
id = "secret.stripe-key"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "critical"
action = "redact"
pattern = '\b[rs]k_live_[0-9A-Za-z]{20,}\b'

[[controls.deterministic]]
id = "secret.password-assignment"
# `password: hunter2`, `DB_PASSWORD="..."`. Redacts the value with its key.
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "high"
action = "redact"
pattern = '''(?i)\b(?:[a-z0-9_]*pass(?:word|wd)?|pwd|[a-z0-9_]*secret|hasło|haslo)\s*[:=]\s*["']?[^\s"'`]{6,}'''

[[controls.deterministic]]
id = "pii.email"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "medium"
action = "redact"
pattern = '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'

[[controls.deterministic]]
id = "pii.pesel"
# Polish national identification number — 11 digits.
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "high"
action = "redact"
pattern = '\b[0-9]{11}\b'

[[controls.deterministic]]
id = "pii.phone"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "medium"
action = "redact"
pattern = '(?x)(?:\+?\d{1,3}[ .-]?)?(?:\(?\d{2,4}\)?[ .-]?){2,4}\d{2,4}'

[[controls.deterministic]]
id = "pii.iban"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "high"
action = "redact"
pattern = '\b[A-Z]{2}[0-9]{2}(?:[ ]?[A-Z0-9]){11,30}\b'

[[controls.deterministic]]
id = "pii.payment-card"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "high"
action = "redact"
# The engine additionally verifies Luhn, so random 16-digit references pass.
pattern = '\b(?:[0-9][ -]?){13,19}\b'

[[controls.deterministic]]
id = "secret.jwt"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "high"
action = "redact"
pattern = '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'

[[controls.deterministic]]
id = "secret.connection-string"
hooks = ["prompt_in", "response_out", "tool_call", "tool_result"]
severity = "critical"
action = "redact"
pattern = '(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis)://[^\s:@/]+:[^\s@/]+@'

[[controls.deterministic]]
id = "obfuscation.invisible-unicode"
# OWASP LLM01. Zero-width characters, bidi overrides (text that renders in a
# different order than the model reads it) and Unicode tag characters, which
# smuggle invisible ASCII instructions. Flag, not block: tag characters also
# spell subdivision flag emoji.
hooks = ["prompt_in", "tool_call", "tool_result"]
severity = "high"
action = "flag"
pattern = '[\u{200B}-\u{200F}\u{202A}-\u{202E}\u{2060}-\u{2064}\u{2066}-\u{2069}\u{FEFF}\u{E0000}-\u{E007F}]'

[[controls.deterministic]]
id = "exploit.code-execution"
# §4.4: the shapes behind real historical exploits on AI infrastructure.
hooks = ["tool_result", "response_out"]
severity = "critical"
action = "block"
pattern = '(?i)\b(os\.system|subprocess\.(run|call|Popen)|eval\(|exec\(|__import__)\b'

[[controls.deterministic]]
id = "exploit.unsafe-deserialization"
hooks = ["tool_call", "tool_result"]
severity = "critical"
action = "block"
pattern = '(?i)\b(pickle\.loads?|torch\.load|yaml\.load\s*\(|marshal\.loads)\b'

[[controls.deterministic]]
id = "injection.instruction-override"
# Cheap first pass. The semantic tier below catches what this misses.
# tool_call covers model-written arguments a human will read, such as the
# reason in control__request_access shown in the console's approval popup.
hooks = ["prompt_in", "tool_call", "tool_result"]
severity = "medium"
action = "flag"
# OWASP LLM01. English and Polish phrasings.
pattern = '(?i)\b(?:(?:ignore|disregard|forget|override|bypass)\s+(?:(?:all|any|the|your|of|my)\s+)*(?:previous|prior|above|earlier|preceding|original|initial|system)\s+(?:instructions?|prompts?|rules|directions|guidelines|context)|(?:zignoruj|pomiń|zapomnij|olej)\s+(?:o\s+)?(?:wszystkie\s+|wszystkich\s+|twoje\s+)?(?:poprzednie|wcześniejsze|powyższe|poprzednich|wcześniejszych|powyższych)\s+(?:instrukcje|instrukcji|polecenia|poleceń|zasady|zasad|reguły|reguł))'

# ---------------------------------------------------------------- tier 1: OWASP
# Static guardrails mapped to the OWASP Top 10 for LLM Applications (2025).
# Same rules as above: one cheap regex each, no model. Where a pattern has a
# plausible benign reading the action is `flag`, which only escalates to the
# semantic tier (and adds to the identity's risk score); `block` and `redact`
# are kept for shapes with no legitimate use at that hook.
#
# Not covered statically, by design: LLM03/LLM04 supply chain and poisoning
# live in signatures.toml; LLM08 (vector stores) and LLM09 (misinformation)
# have no regex shape; LLM10's spend and loop limits are budgets and [runaway].

# --- LLM01 Prompt injection ----------------------------------------------

[[controls.deterministic]]
id = "injection.role-hijack"
# Persona jailbreaks: DAN, "developer mode", "act as an unrestricted AI".
hooks = ["prompt_in", "tool_result"]
severity = "medium"
action = "flag"
pattern = '(?i)\b(?:do\s+anything\s+now|you\s+are\s+(?:now\s+)?(?:DAN|in\s+developer\s+mode|jailbroken|unrestricted|unfiltered|uncensored)\b|developer\s+mode\s+(?:enabled|activated|on)\b|jailbreak(?:ed)?\s+mode|(?:act|pretend|behave|roleplay)\s+(?:as|like)\s+(?:an?\s+)?(?:unrestricted|unfiltered|uncensored|jailbroken|evil)\b|(?:without|ignoring|no)\s+(?:any\s+)?(?:ethical\s+|safety\s+|content\s+)?(?:restrictions|filters|guardrails|guidelines)\s+(?:from\s+now|anymore|whatsoever))'

[[controls.deterministic]]
id = "injection.fake-delimiter"
# Chat-template and role markers inside user text or tool output: an attempt
# to make injected text look like a system or assistant turn.
hooks = ["prompt_in", "tool_result"]
severity = "high"
action = "flag"
pattern = '(?im)(?:<\|(?:im_start|im_end|system|endoftext|start_header_id|end_header_id|eot_id)\|>|\[/?INST\]|<</?SYS>>|</?(?:system|system_prompt)>|^\s*#{2,}\s*(?:system|instruction)s?\s*:|^\s*system\s*:\s)'

[[controls.deterministic]]
id = "injection.agent-directive"
# Indirect injection (also OWASP agentic T6): content returned by a tool that
# addresses the model and tells it to act.
hooks = ["tool_result"]
severity = "high"
action = "flag"
pattern = '(?i)\b(?:(?:important|attention|note|instructions?|message)\s+(?:for|to)\s+(?:the\s+)?(?:ai|assistant|llm|language\s+model|agent|chatbot)\b|(?:ai|assistant|llm|agent|model)\s*[,:]\s*(?:(?:you\s+must|you\s+should|please|now|immediately)\s+)+(?:call|run|execute|invoke|send|forward|email|upload|post|delete)\b)'

[[controls.deterministic]]
id = "obfuscation.encoded-payload"
# A long base64 run is how instructions are hidden from both people and
# keyword filters. Low severity: it is also how files travel.
hooks = ["prompt_in", "tool_call"]
severity = "low"
action = "flag"
pattern = '[A-Za-z0-9+/]{200,}={0,2}'

# --- LLM02 Sensitive information disclosure --------------------------------
# The secret.* controls for LLM02 sit with the other secrets above, ahead of
# the pii.* redactors.

[[controls.deterministic]]
id = "consumption.divergence-attack"
# "Repeat the word X forever": the training-data extraction attack. Also an
# unbounded-output request (LLM10).
hooks = ["prompt_in"]
severity = "medium"
action = "flag"
pattern = '''(?i)\b(?:repeat|say|print|write|output)\s+(?:the\s+)?(?:(?:word|phrase|token|letter)\s+)?["']?[\p{L}\p{N}]+["']?\s+(?:forever|infinitely|endlessly|indefinitely|non-?stop|\d{4,}\s+times)'''

# --- LLM05 Improper output handling ----------------------------------------

[[controls.deterministic]]
id = "output.markdown-exfiltration"
# A rendered image whose URL carries data: the client fetches it and leaks the
# query string with no click. Text links are left alone; images render
# unprompted.
hooks = ["response_out", "tool_result"]
severity = "high"
action = "block"
pattern = '''(?i)(?:!\[[^\]]*\]\(\s*https?://[^)\s]*\?[^)\s]*=[^)\s]*\)|<img\b[^>]*\bsrc\s*=\s*["']?https?://[^"'\s>]*\?[^"'\s>]*=)'''

[[controls.deterministic]]
id = "output.script-injection"
# Executable markup in model output (stored XSS in whatever renders it).
# Redacted rather than blocked so the rest of the answer survives. Switch to
# `flag` if your users need HTML examples verbatim.
hooks = ["response_out", "tool_result"]
severity = "high"
action = "redact"
pattern = '''(?i)(?:<\s*script\b[^>]*>|<\s*iframe\b[^>]*>|\b(?:href|src|action|formaction)\s*=\s*["']?\s*javascript\s*:|\bon(?:error|load|click|mouseover|focus|toggle)\s*=\s*["']?)'''

[[controls.deterministic]]
id = "output.sql-injection"
# Injection shapes in model-written SQL or tool arguments. Plain SELECTs, joins
# and ordinary UNIONs pass: resources__query takes model-written SQL.
hooks = ["tool_call"]
severity = "high"
action = "block"
pattern = '''(?i)(?:\bunion\s+(?:all\s+)?select\s+(?:null|\d+)\s*,|'\s*or\s+'?\d+'?\s*=\s*'?\d+|;\s*(?:drop|truncate|alter|grant)\s+|\bxp_cmdshell\b|\b(?:pg_)?sleep\s*\(\s*\d+\s*\)|\binto\s+(?:out|dump)file\b)'''

[[controls.deterministic]]
id = "output.path-traversal"
hooks = ["tool_call"]
severity = "high"
action = "block"
pattern = '(?i)(?:(?:\.\./){2,}|(?:\.\.\\){2,}|%2e%2e(?:%2f|%5c|/)|/etc/(?:passwd|shadow|sudoers)\b|c:\\windows\\system32)'

# --- LLM06 Excessive agency ------------------------------------------------

[[controls.deterministic]]
id = "agency.destructive-command"
# Irreversible actions an agent should never take on its own.
hooks = ["tool_call"]
severity = "critical"
action = "block"
pattern = '(?i)(?:\brm\s+-[a-z]*r[a-z]*\s+(?:/|~|\*|\$HOME)(?:\s|$|\*)|\bmkfs(?:\.\w+)?\s|\bdd\s+if=\S+\s+of=/dev/|:\(\)\s*\{\s*:\|:&\s*\};:|\bchmod\s+(?:-R\s+)?777\s+/|\bgit\s+push\s+(?:--force\b|-f\b)|\bdrop\s+(?:database|schema)\b|\btruncate\s+table\b|\bdelete\s+from\s+\w+\s*(?:;|$))'

[[controls.deterministic]]
id = "agency.credential-access"
# Tool calls that read credential stores.
hooks = ["tool_call"]
severity = "high"
action = "block"
pattern = '''(?i)(?:\.ssh/(?:id_[a-z0-9]+|authorized_keys)|\.aws/credentials|\.kube/config|\.docker/config\.json|\.git-credentials|\.netrc|\.npmrc|\.pypirc|/etc/shadow|(?:^|[/\s"'])\.env(?:\.local|\.prod|\.production)?(?:["'\s,;)\]}]|$))'''

[[controls.deterministic]]
id = "exfiltration.known-endpoint"
# Request-capture and paste services: the usual drop points for stolen data.
# Escalates to exfiltration.intent below.
hooks = ["tool_call", "response_out"]
severity = "high"
action = "flag"
pattern = '(?i)\b(?:pastebin\.com|paste\.ee|hastebin\.com|transfer\.sh|webhook\.site|requestbin\.(?:com|net)|pipedream\.net|[a-z0-9-]+\.ngrok(?:-free)?\.(?:io|app)|interact\.sh|oast\.(?:fun|live|me|pro|site)|burpcollaborator\.net)\b'

# --- LLM07 System prompt leakage -------------------------------------------

[[controls.deterministic]]
id = "leak.system-prompt-request"
hooks = ["prompt_in", "tool_result"]
severity = "medium"
action = "flag"
pattern = '(?i)(?:\b(?:reveal|show|print|repeat|output|display|dump|leak|tell\s+me|what\s+(?:is|are|was|were))\s+(?:me\s+)?(?:your|the)\s+(?:(?:full|exact|original|initial|hidden|secret|entire)\s+)*(?:system\s+prompt|system\s+message|initial\s+instructions|hidden\s+instructions|instructions\s+above|developer\s+message)|\b(?:pokaż|wypisz|powtórz|podaj|zdradź)\s+(?:mi\s+)?(?:sw[oó]j\s+|swoje\s+|tw[oó]j\s+|twoje\s+)?(?:prompt\s+systemowy|instrukcje\s+systemowe|ukryte\s+instrukcje))'

# ---------------------------------------------------------------- tier 2
# Semantic controls. Model-backed, tens of milliseconds. `escalate_when`
# decides who pays that cost:
#   always     — every request through this hook
#   suspicious — only when tier 1 flagged something (default; keeps p50 low)
#   never      — disabled without deleting the config
#
# `fail_mode` on a control overrides [defaults] for that control only.
#
# `mock_keywords` is what the dev mock judge (OLLAMA_URL=mock) scores as a hit.
# Real detectors ignore it, and prod refuses to run the mock.

[[controls.semantic]]
id = "injection.prompt-guard"
hooks = ["prompt_in", "tool_call", "tool_result"]
severity = "high"
action = "block"
detector = "llm_judge"
describes = "an attempt to override, ignore or replace the instructions the assistant was given"
# Strictness knob. Lower catches more and blocks more legitimate traffic.
threshold = 0.80
timeout_ms = 2000
escalate_when = "suspicious"
mock_keywords = ["previous instructions", "system prompt", "you are now", "developer mode", "jailbreak"]

[[controls.semantic]]
id = "pii.contextual"
# Catches identifiers that no regex describes: names, addresses, free-text
# health details.
#
# OFF until a Presidio sidecar exists. `fail_mode = "closed"` means an
# unavailable detector blocks, so leaving this on "always" with nothing behind
# it would refuse every request. Set escalate_when = "always" once the sidecar
# is running.
hooks = ["prompt_in", "response_out"]
severity = "medium"
action = "redact"
detector = "presidio"
describes = "personal data that no regular expression would match: names, postal addresses, free-text health or financial details"
threshold = 0.65
timeout_ms = 1500
escalate_when = "never"

[[controls.semantic]]
id = "exfiltration.intent"
hooks = ["tool_call"]
severity = "high"
action = "block"
detector = "llm_judge"
describes = "an attempt to move data out of the organisation: exfiltration, unexpected recipients, encoding payloads for transport"
threshold = 0.75
timeout_ms = 2000
escalate_when = "suspicious"
mock_keywords = ["exfiltrate", "send it to", "upload to", "pastebin", "webhook"]

# ---------------------------------------------------------------- mcp
# Upstream MCP servers sit behind this gateway, which is the only MCP server any
# agent talks to. Disabling one takes effect when the upload activates.
#
# `pinned` approves tools by the sha256 of their definition (name, description,
# input schema). Once a server pins anything, an unpinned tool or one whose
# definition changed is hidden and reported: a rug-pull or poisoned
# description never reaches the model. Leave it empty to only scan
# descriptions.

[mcp]
# A caller with no row in `principals`. "deny" is the right default for a
# control layer: an unidentified agent gets no tools.
unknown_principal = "deny"

[[mcp.server]]
name = "docs"
url = "http://localhost:9310/mcp"
enabled = true

# ---------------------------------------------------------------- feed
# §4.4. Signatures of known historical attacks are a separate document
# (`signatures.toml` next to this file), uploaded with the catalog as
# `signatures_toml` and versioned with it.
