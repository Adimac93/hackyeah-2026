# Cloud Build for the model host. Run from the repo root:
#   gcloud builds submit --config ollama/cloudbuild.yaml ollama
#
# The service is private: --no-allow-unauthenticated means every call needs a
# Google identity token, which the gateway fetches from the metadata server.
# An open Ollama endpoint is a free GPU for anyone who finds the URL.

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args: [build, --tag=$_IMAGE, --build-arg=MODEL=$_MODEL, .]

  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, $_IMAGE]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_IMAGE
      - --region=$_REGION
      - --no-allow-unauthenticated
      - --port=8080
      # The smallest shape Cloud Run accepts with a GPU.
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --no-gpu-zonal-redundancy
      - --cpu=4
      - --memory=16Gi
      - --no-cpu-throttling
      # One GPU, ever. A traffic loop costs one instance-hour, not ten.
      - --max-instances=1
      - --min-instances=0
      - --concurrency=4
      - --timeout=300

substitutions:
  _SERVICE: ollama
  _REGION: europe-west1
  _MODEL: llama3.1:8b
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/hackyeah2026/ollama:latest

options:
  # _IMAGE is built from the other substitutions.
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
